services:
  - type: web
    name: piston-execution-engine
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: '2000'
    # Note: Render does not support running Docker in privileged mode.
    # Piston relies on `--privileged` to run `isolate` internally.
    # This deployment is provided for structural completeness but will likely fail to execute code.
